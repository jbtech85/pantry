# production-specific configs

services:
  client:
    build:
      context: ./apps/desktop
      target: production
    env_file:
      - .env
    ports:
      - "${CLIENT_PORT}:80"
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      target: production
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    restart: unless-stopped