name: CI Pipeline

on:
  # push:
  #   branches:
  #     - stage
  workflow_dispatch:

jobs:
  cypress-test:
    runs-on: ubuntu-24.04


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> .env
          echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" >> .env
          echo "CLIENT_PORT=${{ secrets.CLIENT_PORT }}" >> .env
          echo "SERVER_PORT=${{ secrets.SERVER_PORT }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

      - name: Build and start stack
        run: docker compose -f compose.yml -f compose.ci.yml up -d --build

        # we're leaning on compose to perform health checks across dependences, with pantryclient being the last in line
      - name: Wait for stack to be healthy
        run: |
          echo "Wait 2 min for all services to be healthy"
          timeout 120 bash -c '
            until docker inspect pantryclient \
              --format="{{.State.Health.Status}}" | grep -q "healthy"; do
              echo "Waiting for client"
              sleep 5
            done
          '

      - name: run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./frontend 
          config: baseUrl=http://localhost:${{ secrets.CLIENT_PORT }}
  
      - name: Collect logs on failure
        if: failure()
        run: docker compose -f compose.yml -f compose.ci.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f compose.yml -f compose.ci.yml down
