services:
  client:
    container_name: pantryclient
    restart: unless-stopped
    build: ./frontend
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    # lets us hot reload with vite
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /client
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
  api:
    container_name: pantryapi
    restart: unless-stopped
    build: ./backend
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /api
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:18.1-alpine
    container_name: pantrypg
    volumes:
      - db_data:/data/pantrypg
      - ./init:/docker-entrypoint-initdb.d:ro
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_DB}
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    command: "-p ${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 0s
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data: {}
