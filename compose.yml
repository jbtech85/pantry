services:
  client:
    restart: unless-stopped
    build: ./frontend
    ports:
      - "5100:5100"
    # lets us hot reload with vite
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /client
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
  api:
    container_name: pantryapi
    restart: unless-stopped
    build: ./backend
    ports:
      - "4100:4100"
    volumes:
      - .:/backend
      - /backend/node_modules
    
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /api
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    depends_on:
      - mongo
  mongo:
    container_name: pantrydb
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ADMIN_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ADMIN_PASS}
    restart: unless-stopped
    volumes:
      - appdata:/data/pantrydb
    ports:
      - "27117:27117"
    command: --port 27117 ## Docker containers in same compose file still see mongo as 27017 otherwise
volumes:
  appdata:
