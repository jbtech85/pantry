# local dev configs

services:
  client:
    build:
      context: ./apps/desktop
      target: development
    env_file:
      - .env
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${CLIENT_PORT} || exit 1"]
    develop:
      watch:
        - action: sync
          path: ./apps/desktop
          target: /client
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: ./apps/desktop/package.json

  api:
    build:
      context: ./apps/api
      target: development
    env_file:
      - .env
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /api
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: ./apps/api/package.json

  postgres:
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped

  
  e2e:
    profiles:
      - testing
    image: cypress/included:14.0.0
    container_name: cypress
    networks:
      - pantry-network
    working_dir: /app
    depends_on:
      client:
        condition: service_healthy
    environment:
      - CYPRESS_baseUrl=http://client:${CLIENT_PORT}
    command: npx cypress run
    volumes:
      - ./apps/desktop/cypress:/app/cypress
      - ./apps/desktop/cypress.config.js:/app/cypress.config.js